<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- 🧩 Charset & Viewport -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- 🏷️ Title & Meta -->
    <title>GenZeeTech - Web & App Development Experts</title>
    <meta
      name="description"
      content="GenZeeTech builds fast, scalable, and future-ready web & mobile applications using React, Node.js, Java, Spring Boot, and AWS. Innovative tech solutions for startups and enterprises."
    />
    <meta
      name="keywords"
      content="GenZeeTech, Web Development, App Development, React, Node.js, Java, Spring Boot, TailwindCSS, AWS, MongoDB, Full Stack Development, Digital Solutions, Software Company"
    />
    <meta name="author" content="GenZeeTech Team" />

    <!-- 🌐 Open Graph (Basic Preview for link sharing) -->
    <meta property="og:title" content="GenZeeTech - Web & App Development Experts" />
    <meta
      property="og:description"
      content="We create scalable, secure, and modern digital solutions with React, Node.js, Java, and AWS Cloud."
    />
    <meta property="og:image" content="https://genzeetech.com/seo-preview.jpg" />
    <!-- Optional (for later when social pages exist)
    <meta property="og:url" content="https://genzeetech.com/" />
    <meta property="og:type" content="website" />
    -->

    <!-- 🐦 Twitter Cards (Optional: comment for now, add later when Twitter account exists)
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GenZeeTech - Web & App Development Experts" />
    <meta
      name="twitter:description"
      content="Scalable, modern, and future-ready web & app solutions built by GenZeeTech."
    />
    <meta name="twitter:image" content="https://genzeetech.com/seo-preview.jpg" />
    -->

    <!-- 💎 Favicon -->

<!-- <link rel="icon" type="image/png" sizes="32x32" href="https://genzeetech.com/favicon.png" />
<link rel="apple-touch-icon" href="https://genzeetech.com/apple-touch-icon.png" />
<link rel="shortcut icon" href="https://genzeetech.com/favicon.png" type="image/png" /> -->
    <!-- 💎 Favicon (works on both www & non-www + Google compatible) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/favicon.png" />


    <!-- ⚡ Fonts Optimization -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
      media="all"
    />

    <!-- 🔗 Canonical -->
    <link rel="canonical" href="https://genzeetech.com/" />

    <!-- 🧠 Structured Data (JSON-LD Schema for SEO) -->
    <script type="application/ld+json">
      { 
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "GenZeeTech",
        "url": "https://genzeetech.com",
        "logo": "https://genzeetech.com/logo.webp",
        "description": "GenZeeTech builds scalable, modern web and mobile applications using React, Node.js, Java, Spring Boot, and AWS.",
        "foundingDate": "2024",
        "founders": [
          { "@type": "Person", "name": "GenZeeTech Team" }
        ],
        "contactPoint": [{
          "@type": "ContactPoint",
          "contactType": "Customer Support",
          "email": "support@genzeetech.com",
          "availableLanguage": ["English", "Hindi"]
        }]
        /* Optional social links (add later when profiles exist)
        ,"sameAs": [
          "https://www.linkedin.com/company/genzeetech",
          "https://twitter.com/genzeetech",
          "https://www.facebook.com/genzeetech"
        ]
        */
      }
    </script>

    <!-- 🔍 Robots + Theme -->
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0ea5e9" />
  </head>

  <body>
    <div id="root"></div>

    <!-- 🚀 Main Script -->
    <script type="module" src="/src/main.jsx" defer></script>
  </body>
</html>
